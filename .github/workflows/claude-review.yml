name: Claude Code Review

# PR이 열리거나 갱신되면 Claude가 변경분을 리뷰해 코멘트로 남긴다.
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write
  actions: read

jobs:
  claude-review:
    runs-on: ubuntu-latest
    # 유효한 CLAUDE_CODE_OAUTH_TOKEN(또는 ANTHROPIC_API_KEY)이 설정되기 전까지
    # 인증 실패가 PR을 막거나 빨간 X로 시끄럽지 않도록 비차단 처리.
    # 토큰 발급: `claude setup-token` → gh secret set CLAUDE_CODE_OAUTH_TOKEN
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            이 PR의 변경분을 리뷰해줘. 한국어로, 간결하게.
            우선순위: ① 정확성·버그·엣지케이스 ② 보안(키 노출·인젝션) ③ React 품질(effect 정리·포커스·접근성) ④ 회귀.
            확신 높은 문제만 심각도(blocker/high/medium/low)와 함께 지적하고, 칭찬은 생략해줘.
            중요한 건 해당 라인에 인라인 코멘트로 남겨줘.
          claude_args: |
            --max-turns 8
